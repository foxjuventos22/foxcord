<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111214"><title>FoxCord</title><link rel="stylesheet" href="/style.css"></head><body>
<div id="loginOverlay" class="overlay"><form id="loginForm" class="login-card"><div class="fox">🦊</div><h1>FoxCord</h1><p>Entre no seu chat.</p><label>Seu nome<input id="nameInput" maxlength="30" required placeholder="Digite seu nome"></label><label>Sala<input id="roomInput" maxlength="40" value="geral"></label><button class="primary">Entrar</button><small>Seu nome fica salvo neste navegador.</small></form></div>
<div class="app"><aside class="sidebar"><div class="logo">🦊 FoxCord</div><div class="section-title">SALAS</div><div id="roomList" class="room-list"></div><div class="new-room"><input id="newRoomInput" maxlength="40" placeholder="Nova sala"><button id="newRoomBtn">＋</button></div><div class="user-box"><div class="avatar">🦊</div><div class="user-info"><strong id="myName">Usuário</strong><span>online</span></div><button id="renameBtn">✎</button></div></aside>
<main class="main"><header class="topbar"><div class="room-heading"><span class="hash">#</span><strong id="roomName">geral</strong><span id="status" class="status offline">conectando…</span></div><div class="actions"><button id="callBtn" class="action">🎙️ Entrar na chamada</button><button id="screenBtn" class="action" disabled>🖥️ Compartilhar tela</button><button id="hangupBtn" class="action danger" disabled>⏹ Sair da chamada</button></div></header>
<section class="content"><div class="video-area"><div id="videos" class="videos"><div id="emptyVideo" class="empty"><div>🦊</div><h2>Bem-vindo ao FoxCord</h2><p>Envie mensagens ou entre na chamada.</p></div></div></div><aside class="chat"><div class="chat-header">💬 Chat <span id="userCount" class="count">0</span></div><div id="messages" class="messages"></div><form id="chatForm" class="chat-form"><input id="chatInput" maxlength="2000" autocomplete="off" placeholder="Mensagem em #geral"><button>Enviar</button></form></aside></section></main></div>
<script src="/socket.io/socket.io.js"></script><script src="/app.js"></script></body></html>
